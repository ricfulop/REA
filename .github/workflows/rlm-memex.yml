name: REA runtime adapter
on:
  push:
    paths: ['rlm_memex/**', 'tests/_rlm_memex/**', '.github/workflows/rlm-memex.yml']
  pull_request:
    paths: ['rlm_memex/**', 'tests/_rlm_memex/**', '.github/workflows/rlm-memex.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m unittest discover -s tests/_rlm_memex -v
