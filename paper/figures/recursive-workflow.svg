   <g id="text_1">
    <text style="font-weight: 700; font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start" x="17.388" y="24.6528" transform="rotate(-0 17.388 24.6528)">B   Recursive investigation separates corpus scale from per-call context</text>
   </g>
   <g id="text_2">
    <text style="font-weight: 700; font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start" x="17.388" y="53.1072" transform="rotate(-0 17.388 53.1072)">1  Single-call prompt</text>
   </g>
   <g id="text_3">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #222222" transform="translate(25.574484 83.383622)">Selected specifications</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #222222" transform="translate(29.725734 93.461653)">and manual excerpts</text>
   </g>
   <g id="text_4">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #222222" transform="translate(211.049719 83.383622)">One model call</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #222222" transform="translate(217.945969 93.461653)">≤1M tokens</text>
   </g>
   <g id="text_5">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #222222" x="414.792" y="88.422637" transform="rotate(-0 414.792 88.422637)">Engineering response</text>
   </g>
   <g id="text_6">
    <text style="font-size: 8px; font-family: 'DejaVu Sans'; text-anchor: start" x="22.176" y="121.83552" transform="rotate(-0 22.176 121.83552)">Only supplied evidence is visible in this call; selection must happen upstream.</text>
   </g>
   <g id="text_7">
    <text style="font-weight: 700; font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start" x="17.388" y="146.78784" transform="rotate(-0 17.388 146.78784)">2  Retrieval-based agent</text>
   </g>
   <g id="text_8">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #222222" x="77.238" y="178.163437" transform="rotate(-0 77.238 178.163437)">Large external corpus</text>
   </g>
   <g id="text_9">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #222222" transform="translate(205.296047 173.124422)">Retrieve excerpts</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #222222" transform="translate(195.215344 183.202453)">+ bounded model call</text>
   </g>
   <g id="text_10">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #222222" x="414.792" y="178.163437" transform="rotate(-0 414.792 178.163437)">Response / next query</text>
   </g>
   <g id="text_11">
    <text style="font-size: 8px; font-family: 'DejaVu Sans'; text-anchor: start" x="22.176" y="211.57632" transform="rotate(-0 22.176 211.57632)">Also accesses corpora larger than a prompt and can iterate across turns.</text>
   </g>
   <g id="text_12">
    <text style="font-weight: 700; font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #0072b2" x="17.388" y="236.52864" transform="rotate(-0 17.388 236.52864)">3  REA recursive investigation</text>
   </g>
   <g id="text_13">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #222222" transform="translate(39.9105 274.242206)">Versioned stores</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #222222" transform="translate(24.919875 284.320237)">Parts • tools • manuals</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #222222" transform="translate(31.354172 294.398269)">Datasets • evidence</text>
   </g>
   <g id="text_14">
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'; fill: #222222" transform="translate(206.329602 274.664128)">Root investigation</text>
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'; fill: #222222" transform="translate(194.082961 284.182269)">Plan • inspect • recurse</text>
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'; fill: #222222" transform="translate(185.235656 293.700409)">Revisit unresolved evidence</text>
   </g>
   <g id="text_15">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #222222" transform="translate(374.805984 274.242206)">Integrate findings</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #222222" transform="translate(374.512781 284.320237)">Check constraints</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #222222" transform="translate(366.192 294.398269)">Cite sources / abstain</text>
   </g>
   <g id="text_16">
    <text style="font-size: 8px; font-family: 'DejaVu Sans'; fill: #222222" transform="translate(186.020125 364.928375)">Parts subcall</text>
    <text style="font-size: 8px; font-family: 'DejaVu Sans'; fill: #222222" transform="translate(172.81325 373.886625)">Filter specifications</text>
   </g>
   <g id="text_17">
    <text style="font-size: 8px; font-family: 'DejaVu Sans'; fill: #222222" transform="translate(286.029125 360.44925)">Procedure subcall</text>
    <text style="font-size: 8px; font-family: 'DejaVu Sans'; fill: #222222" transform="translate(285.296 369.4075)">Inspect procedure</text>
    <text style="font-size: 8px; font-family: 'DejaVu Sans'; fill: #222222" transform="translate(291.0185 378.36575)">Return findings</text>
   </g>
   <g id="text_18">
    <text style="font-size: 8px; font-family: 'DejaVu Sans'; fill: #222222" transform="translate(50.264875 360.44925)">Paged access</text>
    <text style="font-size: 8px; font-family: 'DejaVu Sans'; fill: #222222" transform="translate(45.92925 369.4075)">+ durable state</text>
    <text style="font-size: 8px; font-family: 'DejaVu Sans'; fill: #222222" transform="translate(29.999875 378.36575)">Needed for target scale</text>
   </g>
   <g id="text_19">
    <text style="font-size: 8px; font-family: 'DejaVu Sans'; text-anchor: start" x="22.176" y="411.19488" transform="rotate(-0 22.176 411.19488)">Every model call remains bounded. Selective access does not imply reading every record.</text>
   </g>
   <g id="text_20">
    <text style="font-size: 8px; font-family: 'DejaVu Sans'; text-anchor: start" x="22.176" y="430.45632" transform="rotate(-0 22.176 430.45632)">Current REA materializes a bounded corpus in RAM. 60M-part operation is a design target.</text>
   </g>
  </g>
 </g>
