   <g id="text_1">
    <text style="font-weight: 700; font-size: 9px; font-family: 'Helvetica', 'Arial', 'DejaVu Sans', sans-serif; text-anchor: start" x="17.98416" y="49.788" transform="rotate(-0 17.98416 49.788)">1  Single-call prompt</text>
   </g>
   <g id="text_2">
    <text style="font-size: 9px; font-family: 'Helvetica', 'Arial', 'DejaVu Sans', sans-serif" transform="translate(34.112722 78.121688)">Selected specifications</text>
    <text style="font-size: 9px; font-family: 'Helvetica', 'Arial', 'DejaVu Sans', sans-serif" transform="translate(38.11491 87.77025)">and manual excerpts</text>
   </g>
   <g id="text_3">
    <text style="font-size: 9px; font-family: 'Helvetica', 'Arial', 'DejaVu Sans', sans-serif" transform="translate(223.198869 78.046453)">One model call</text>
    <text style="font-size: 9px; font-family: 'Helvetica', 'Arial', 'DejaVu Sans', sans-serif" transform="translate(229.983322 87.669703)">≤1M tokens</text>
   </g>
   <g id="text_4">
    <text style="font-size: 9px; font-family: 'Helvetica', 'Arial', 'DejaVu Sans', sans-serif; text-anchor: middle" x="429.01344" y="82.800422" transform="rotate(-0 429.01344 82.800422)">Engineering response</text>
   </g>
   <g id="text_5">
    <text style="font-size: 8px; font-family: 'Helvetica', 'Arial', 'DejaVu Sans', sans-serif; text-anchor: start" x="22.93632" y="114.2208" transform="rotate(-0 22.93632 114.2208)">Only supplied evidence is visible in this call; selection must happen upstream.</text>
   </g>
   <g id="text_6">
    <text style="font-weight: 700; font-size: 9px; font-family: 'Helvetica', 'Arial', 'DejaVu Sans', sans-serif; text-anchor: start" x="17.98416" y="137.6136" transform="rotate(-0 17.98416 137.6136)">2  Retrieval-based agent</text>
   </g>
   <g id="text_7">
    <text style="font-size: 9px; font-family: 'Helvetica', 'Arial', 'DejaVu Sans', sans-serif; text-anchor: middle" x="79.88616" y="166.932422" transform="rotate(-0 79.88616 166.932422)">Large external corpus</text>
   </g>
   <g id="text_8">
    <text style="font-size: 9px; font-family: 'Helvetica', 'Arial', 'DejaVu Sans', sans-serif" transform="translate(218.200354 162.178453)">Retrieve excerpts</text>
    <text style="font-size: 9px; font-family: 'Helvetica', 'Arial', 'DejaVu Sans', sans-serif" transform="translate(210.308479 171.801703)">+ bounded model call</text>
   </g>
   <g id="text_9">
    <text style="font-size: 9px; font-family: 'Helvetica', 'Arial', 'DejaVu Sans', sans-serif; text-anchor: middle" x="429.01344" y="166.963359" transform="rotate(-0 429.01344 166.963359)">Response / next query</text>
   </g>
   <g id="text_10">
    <text style="font-size: 8px; font-family: 'Helvetica', 'Arial', 'DejaVu Sans', sans-serif; text-anchor: start" x="22.93632" y="198.3528" transform="rotate(-0 22.93632 198.3528)">Also accesses corpora larger than a prompt and can iterate across turns.</text>
   </g>
   <g id="text_11">
    <text style="font-weight: 700; font-size: 9px; font-family: 'Helvetica', 'Arial', 'DejaVu Sans', sans-serif; text-anchor: start" x="17.98416" y="221.7456" transform="rotate(-0 17.98416 221.7456)">3  REA recursive investigation</text>
   </g>
   <g id="text_12">
    <text style="font-size: 9px; font-family: 'Helvetica', 'Arial', 'DejaVu Sans', sans-serif" transform="translate(46.120691 256.888828)">Versioned stores</text>
    <text style="font-size: 9px; font-family: 'Helvetica', 'Arial', 'DejaVu Sans', sans-serif" transform="translate(34.718816 266.512078)">Parts • tools • manuals</text>
    <text style="font-size: 9px; font-family: 'Helvetica', 'Arial', 'DejaVu Sans', sans-serif" transform="translate(40.040769 276.135328)">Datasets • evidence</text>
   </g>
   <g id="text_13">
    <text style="font-size: 8.5px; font-family: 'Helvetica', 'Arial', 'DejaVu Sans', sans-serif" transform="translate(219.429573 257.241773)">Root investigation</text>
    <text style="font-size: 8.5px; font-family: 'Helvetica', 'Arial', 'DejaVu Sans', sans-serif" transform="translate(209.371018 266.439305)">Plan • inspect • recurse</text>
    <text style="font-size: 8.5px; font-family: 'Helvetica', 'Arial', 'DejaVu Sans', sans-serif" transform="translate(200.297268 275.52793)">Revisit unresolved evidence</text>
   </g>
   <g id="text_14">
    <text style="font-size: 9px; font-family: 'Helvetica', 'Arial', 'DejaVu Sans', sans-serif" transform="translate(394.492815 256.876875)">Integrate findings</text>
    <text style="font-size: 9px; font-family: 'Helvetica', 'Arial', 'DejaVu Sans', sans-serif" transform="translate(393.250393 266.615437)">Check constraints</text>
    <text style="font-size: 9px; font-family: 'Helvetica', 'Arial', 'DejaVu Sans', sans-serif" transform="translate(385.745237 276.238687)">Cite sources / abstain</text>
   </g>
   <g id="text_15">
    <text style="font-size: 8px; font-family: 'Helvetica', 'Arial', 'DejaVu Sans', sans-serif" transform="translate(195.64914 341.959875)">Parts subcall</text>
    <text style="font-size: 8px; font-family: 'Helvetica', 'Arial', 'DejaVu Sans', sans-serif" transform="translate(184.53664 350.611375)">Filter specifications</text>
   </g>
   <g id="text_16">
    <text style="font-size: 8px; font-family: 'Helvetica', 'Arial', 'DejaVu Sans', sans-serif" transform="translate(300.430695 337.620375)">Procedure subcall</text>
    <text style="font-size: 8px; font-family: 'Helvetica', 'Arial', 'DejaVu Sans', sans-serif" transform="translate(300.429445 346.196875)">Inspect procedure</text>
    <text style="font-size: 8px; font-family: 'Helvetica', 'Arial', 'DejaVu Sans', sans-serif" transform="translate(305.54382 354.848375)">Return findings</text>
   </g>
   <g id="text_17">
    <text style="font-size: 8px; font-family: 'Helvetica', 'Arial', 'DejaVu Sans', sans-serif" transform="translate(54.760535 337.58975)">Paged access</text>
    <text style="font-size: 8px; font-family: 'Helvetica', 'Arial', 'DejaVu Sans', sans-serif" transform="translate(53.31366 346.24625)">+ durable state</text>
    <text style="font-size: 8px; font-family: 'Helvetica', 'Arial', 'DejaVu Sans', sans-serif" transform="translate(38.309285 354.89775)">Needed for target scale</text>
   </g>
   <g id="text_18">
    <text style="font-size: 8px; font-family: 'Helvetica', 'Arial', 'DejaVu Sans', sans-serif; text-anchor: start" x="22.93632" y="385.4952" transform="rotate(-0 22.93632 385.4952)">Every model call remains bounded. Selective access does not imply reading every record.</text>
   </g>
   <g id="text_19">
    <text style="font-size: 8px; font-family: 'Helvetica', 'Arial', 'DejaVu Sans', sans-serif; text-anchor: start" x="22.93632" y="403.5528" transform="rotate(-0 22.93632 403.5528)">Current REA materializes a bounded corpus in RAM. 60M-part operation is a design target.</text>
   </g>
  </g>
 </g>
